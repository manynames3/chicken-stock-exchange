<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffdb40" />
    <meta
      name="description"
      content="Good News Bad News: a chicken-powered stock market board game. Trade, read the news, and play with 2–4 friends in a private room."
    />
    <title>Good News Bad News · 주식</title>
    <link rel="icon" href="/assets/chicken-news-logo.png" type="image/png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/table.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand" aria-label="Good News Bad News home"
        ><img class="brand-chicken" src="/assets/chicken-news-logo.png" alt="" width="64" height="64"
        /><span class="brand-title"><span>GOOD NEWS</span><span>BAD NEWS</span></span></a
      >
      <div class="header-controls">
        <span id="connection" role="status"></span
        ><button
          id="sound-button"
          class="sound-button"
          aria-label="Enable game sounds"
          aria-pressed="false"
        >
          ♪</button
        ><button id="rules-button" class="quiet">How to play</button
        ><button id="language" class="language" aria-label="Change language">
          한국어
        </button>
      </div>
    </header>
    <main id="app"></main>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="rules-dialog" aria-labelledby="rules-title">
      <div class="dialog-heading">
        <h2 id="rules-title"></h2>
        <button id="close-rules" class="icon-button" aria-label="Close">
          ✕
        </button>
      </div>
      <div id="rules-content"></div>
      <button id="rules-done" class="primary full"></button>
    </dialog>
    <dialog id="newspaper-dialog" aria-labelledby="newspaper-title">
      <div class="dialog-heading"><h2 id="newspaper-title"></h2><button id="close-newspaper" class="icon-button" aria-label="Close newspaper">✕</button></div>
      <div id="expanded-newspaper"></div>
    </dialog>
    <footer>
      <span>Good News Bad News · 주식</span
      ><span id="footer-copy">Fictional stocks. Real friends.</span>
    </footer>
  </body>
</html>
