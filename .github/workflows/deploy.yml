name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy:server
      - run: npm run build
        env:
          GAME_SERVER_URL: https://chicken-stock-exchange-server.hangi87.workers.dev
      - run: npm run deploy:pages
