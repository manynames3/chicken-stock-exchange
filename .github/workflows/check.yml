name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/worker.js && node --check public/app.js
      - run: npm run build
        env:
          GAME_SERVER_URL: https://chicken-stock-exchange-server.hangi87.workers.dev
